name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      # The toolchain (and rustfmt/clippy) comes from rust-toolchain.toml.
      - run: rustup show active-toolchain
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --release -p gm-app
      - uses: actions/upload-artifact@v4
        with:
          name: gm-${{ matrix.os }}
          path: |
            target/release/gm
            target/release/gm.exe

  minimal-features:
    name: build without modules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo build -p gm-app --no-default-features
